# TEMPORARY (removed after one run): measures the Linux startup crash
# (PartitionAlloc FreelistCorruptionDetected, a Pango/FontConfig init race) on GitHub's
# runners, A = the AppImage as shipped vs B = the same AppImage with the FontConfig
# pre-init that blip-ai-linux PR #26 adds, randomised per cold start. Also checks that
# a soft "ulimit -c 0" stops a crashed instance from lingering while its core streams
# to systemd-coredump. Prints counts only, uses no secrets, deletes cores.
name: TEMP fc race test
on:
  push:
    paths:
      - ".github/workflows/tmp-fc-race-test.yml"
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag holding the test AppImage", default: "v0.5.10-linux.6" }
      asset: { description: "AppImage asset name", default: "Blip-AI-0.5.10-linux.6.AppImage" }
      runs: { description: "Cold starts per job (randomised A/B)", default: "600" }
permissions:
  contents: write   # read-only use: a draft release is only visible to a token with push access
concurrency:
  group: tmp-fc-race-test-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || 'v0.5.10-linux.6' }}
  ASSET: ${{ inputs.asset || 'Blip-AI-0.5.10-linux.6.AppImage' }}
  RUNS: ${{ inputs.runs || '600' }}
jobs:
  coldstart:
    name: cold starts ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04-x11,     os: ubuntu-24.04, session: x11,     container: "" }
          - { name: ubuntu-24.04-wayland, os: ubuntu-24.04, session: wayland, container: "" }
          - { name: ubuntu-22.04-x11,     os: ubuntu-22.04, session: x11,     container: "" }
          - { name: debian-12-x11,        os: ubuntu-24.04, session: x11,     container: "debian:12" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container && fromJSON(format('{{"image":"{0}","options":"--privileged --device /dev/fuse"}}', matrix.container)) || null }}
    timeout-minutes: 300
    steps:
      - name: Install deps
        shell: bash
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          PKGS="xvfb x11-utils dbus-x11 gcc libc6-dev libfontconfig1 libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 procps psmisc curl ca-certificates fuse3 libfuse2 file"
          if grep -q 'VERSION_ID="24.04"' /etc/os-release; then PKGS="${PKGS/libfuse2/libfuse2t64}"; PKGS="${PKGS/libasound2 /libasound2t64 }"; PKGS="${PKGS/libgtk-3-0 /libgtk-3-0t64 }"; fi
          [ "${{ matrix.session }}" = wayland ] && PKGS="$PKGS weston xwayland"
          $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS > /dev/null
          if ! command -v gh > /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg
            echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list
            apt-get update -qq && apt-get install -y -qq gh > /dev/null
          fi
          echo "pango: $(dpkg-query -W -f='${Version}' 'libpango-1.0-0*' 2>/dev/null)  fontconfig: $(dpkg-query -W -f='${Version}' libfontconfig1)  kernel: $(uname -r)"
      - name: Download the test AppImage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D "$RUNNER_TEMP/app"
          chmod +x "$RUNNER_TEMP/app/$ASSET"
          sha256sum "$RUNNER_TEMP/app/$ASSET"
      - name: Build the FontConfig pre-init preload (arm B)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fc"
          cat > "$RUNNER_TEMP/fc/fc-preinit.c" <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <limits.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          static int is_browser(int argc, char **argv) {
            char exe[PATH_MAX]; ssize_t n = readlink("/proc/self/exe", exe, sizeof exe - 1);
            if (n <= 0) return 0;
            exe[n] = 0;
            const char *b = strrchr(exe, '/'); b = b ? b + 1 : exe;
            if (strcmp(b, "blip-ai") != 0) return 0;
            for (int i = 1; i < argc; i++) if (strncmp(argv[i], "--type=", 7) == 0) return 0;
            return 1;
          }
          static void strip_self(void) {
            Dl_info info; const char *pre = getenv("LD_PRELOAD");
            if (!pre || !dladdr((void *)strip_self, &info) || !info.dli_fname) return;
            char *copy = strdup(pre), *out = calloc(1, strlen(pre) + 1), *save = NULL;
            if (!copy || !out) { free(copy); free(out); return; }
            for (char *t = strtok_r(copy, ": ", &save); t; t = strtok_r(NULL, ": ", &save)) {
              if (strcmp(t, info.dli_fname) == 0) continue;
              if (out[0]) strcat(out, ":");
              strcat(out, t);
            }
            if (out[0]) setenv("LD_PRELOAD", out, 1); else unsetenv("LD_PRELOAD");
            free(copy); free(out);
          }
          __attribute__((constructor)) static void fc_preinit(int argc, char **argv, char **envp) {
            (void)envp;
            if (!is_browser(argc, argv)) return;
            strip_self();
            void *h = dlopen("libfontconfig.so.1", RTLD_NOW | RTLD_LOCAL);
            int (*fc_init)(void) = h ? (int (*)(void))dlsym(h, "FcInit") : NULL;
            if (fc_init) fc_init();
          }
          EOF
          gcc -O2 -fPIC -shared -o "$RUNNER_TEMP/fc/libblip-fc-preinit.so" "$RUNNER_TEMP/fc/fc-preinit.c" -ldl
      - name: Start the display
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          eval "$(dbus-launch --sh-syntax)"; echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          if [ "${{ matrix.session }}" = wayland ]; then
            # Electron 37 has no Ozone flag here, so the app is an X11 client via Xwayland on a Wayland session.
            before=$(ls /tmp/.X11-unix 2>/dev/null | sort)
            (weston --backend=headless-backend.so --socket=wayland-1 --xwayland --width=1280 --height=800 > "$RUNNER_TEMP/weston.log" 2>&1 &)
            for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-1" ] && break; sleep 0.2; done
            sleep 2
            new=$(comm -13 <(echo "$before") <(ls /tmp/.X11-unix 2>/dev/null | sort) | grep -o '[0-9]*' | head -1)
            [ -n "$new" ] || { cat "$RUNNER_TEMP/weston.log"; echo "::error::Xwayland did not open a display"; exit 1; }
            { echo "WAYLAND_DISPLAY=wayland-1"; echo "XDG_SESSION_TYPE=wayland"; echo "DISPLAY=:$new"; } >> "$GITHUB_ENV"
          else
            (Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &)
            sleep 1
            { echo "DISPLAY=:99"; echo "XDG_SESSION_TYPE=x11"; } >> "$GITHUB_ENV"
          fi
      - name: Cold starts, randomised A/B
        shell: bash
        run: |
          SUDO=$(command -v sudo || true)
          # No core at all in this job so a crash exits at once (the core is written after the race; linger is tested in 'coredump').
          $SUDO sysctl -q kernel.core_pattern=core || true
          ulimit -c 0
          APP="$RUNNER_TEMP/app/$ASSET"; PRE="$RUNNER_TEMP/fc/libblip-fc-preinit.so"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"; : > "$OUT/res.txt"
          for i in $(seq 1 "$RUNS"); do
            d="$RUNNER_TEMP/r"; rm -rf "$d"; mkdir -p "$d/home"
            if [ $((RANDOM % 2)) = 0 ]; then arm=A; pre=""; else arm=B; pre="$PRE"; fi
            HOME="$d/home" LD_PRELOAD="$pre" setsid "$APP" > "$d/log" 2>&1 &
            pid=$!
            sleep 8
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid"; for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
              kill -KILL "$pid" 2>/dev/null; wait "$pid" 2>/dev/null; rc=$?; early=0
            else
              wait "$pid"; rc=$?; early=1
            fi
            echo "$i $arm early=$early rc=$rc" >> "$OUT/res.txt"
            if [ "$early" = 1 ]; then echo "--- run $i arm $arm rc=$rc"; tail -n 5 "$d/log"; fi
            pkill -KILL -s "$pid" 2>/dev/null || true
          done
          echo "=== dmesg traps (offset 7009863 = FreelistCorruptionDetected)"
          $SUDO dmesg 2>/dev/null | grep -E 'traps: blip-ai' | sed -E 's/.*(trap int3|trap [a-z ]+).* in blip-ai\[([0-9a-f]+),.*/\1 \2/' | sort | uniq -c || echo "(no dmesg access)"
          for a in A B; do
            n=$(grep -c " $a " "$OUT/res.txt"); c=$(grep " $a " "$OUT/res.txt" | grep -c 'early=1 rc=133'); e=$(grep " $a " "$OUT/res.txt" | grep -c 'early=1')
            echo "ARM $a: runs=$n sigtrap_at_startup=$c any_early_exit=$e" | tee -a "$GITHUB_STEP_SUMMARY"
          done
  coredump:
    name: crashed-instance linger, systemd-coredump, ulimit -c 0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb dbus-x11 libfuse2t64 systemd-coredump > /dev/null
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
      - name: Download the test AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D "$RUNNER_TEMP/app"
          chmod +x "$RUNNER_TEMP/app/$ASSET"
      - name: Crash the browser process with and without ulimit -c 0
        run: |
          (Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &); export DISPLAY=:99; sleep 1
          eval "$(dbus-launch --sh-syntax)"
          case "$(cat /proc/sys/kernel/core_pattern)" in *systemd-coredump*) ;; *) echo "::error::core_pattern is not systemd-coredump"; exit 1;; esac
          APP="$RUNNER_TEMP/app/$ASSET"
          one() {  # $1 = label, $2 = core limit
            d="$RUNNER_TEMP/c"; rm -rf "$d"; mkdir -p "$d/home"
            ( ulimit -c "$2"; HOME="$d/home" exec setsid "$APP" > "$d/log" 2>&1 ) &
            sleep 10
            bp=$(pgrep -f '/tmp/.mount_.*/blip-ai$|/tmp/.mount_.*/blip-ai --no-sandbox$' | head -1)
            [ -n "$bp" ] || { echo "$1: browser not found"; return; }
            t0=$(date +%s.%N)
            kill -SEGV "$bp"   # same kernel core-dump path as the int3 trap
            gone=""; for _ in $(seq 1 3600); do kill -0 "$bp" 2>/dev/null || { gone=$(date +%s.%N); break; }; sleep 0.1; done
            state=$(ps -o stat=,wchan:24= -p "$bp" 2>/dev/null)
            t1=${gone:-$(date +%s.%N)}
            mleft=$(grep -c '/tmp/.mount_' /proc/mounts)
            secs=$(awk -v a="$t0" -v b="$t1" 'BEGIN{printf "%.1f", b-a}')
            if [ -n "$gone" ]; then verdict="exited after ${secs}s"; else verdict="STILL ALIVE after ${secs}s ($state)"; fi
            echo "$1 (ulimit -c $2): browser $verdict; FUSE mounts left: $mleft" | tee -a "$GITHUB_STEP_SUMMARY"
            pkill -KILL -s "$bp" 2>/dev/null; sleep 3
          }
          for k in 1 2 3; do one "default" unlimited; one "default" 0; done
          echo "--- systemd-coredump verdicts"
          sudo journalctl -q -o cat -t systemd-coredump --no-pager | grep -E 'Resource limits|dumped core|blip-ai' | cut -c1-200 | tail -20
          coredumpctl list --no-pager 2>/dev/null | tail -10 || true
          sudo rm -rf /var/lib/systemd/coredump/*
